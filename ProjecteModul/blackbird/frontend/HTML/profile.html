<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile | BlackBird</title>
  <link rel="stylesheet" href="Styles/generalStyles.css" />
  <link rel="stylesheet" href="Styles/profileStyles.css" />
</head>
<body>

<main>
  <section class="profile-header">
    <div class="user-info">
      <h2>User Name</h2>
      <p>@username</p>
      <p class="description">Description</p>
      
      <div class="stats">
        <span><strong>X</strong> following</span>
        <span><strong>X</strong> follower</span>
      </div>
      
      <div class="profile-tabs">
        <button class="tab active">My Posts</button>
        <button class="tab">My Replies</button>
        <button class="tab">My Likes</button>
      </div>
    </div>
    
    <button class="edit-profile-btn">EDIT PROFILE</button>
  </section>

  <section class="user-posts">
    <div class="post">
      <strong>user user</strong>
      <p>@username</p>
      <p>Today is a nice day!</p>
    </div>
    
    <div class="post">
      <strong>user user</strong>
      <p>@username</p>
      <p>Messi is the G.O.A.T</p>
    </div>
  </section>
</main>

  <script src="JS/left-bar.js"></script>
  <script src="JS/right-bar.js"></script>
  <script src="JS/theme.js"></script>

</body>
</html>
