<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages | BlackBird</title>
  <link rel="stylesheet" href="Styles/generalStyles.css" />
  <link rel="stylesheet" href="Styles/messagesStyles.css" />
</head>
<body>

<main style="grid-column: 2 / span 6;">
  <section class="messages-container">
    <div class="conversations-list">
      <input type="text" placeholder="Search messages" class="search-input">
      
      <div class="conversation">
        <strong>@username</strong>
        <p>how are you?</p>
      </div>
      
      <div class="conversation">
        <strong>@username</strong>
        <p>Do you have seen the match?</p>
      </div>
      
      <div class="conversation">
        <strong>@username</strong>
        <p>What are you doing?</p>
      </div>
      
      <div class="conversation">
        <strong>@username</strong>
        <p>we can go to the mountain</p>
      </div>
    </div>
    
    <div class="chat">
      <h1>Select a chat</h1>
      <p>Choose from your existing conversations, start a new one, or just keep swimming.</p>
      <button class="new-message-btn">New Message</button>
    </div>
  </section>
</main>

  <script src="JS/left-bar.js"></script>
  <script src="JS/theme.js"></script>

</body>
</html>
