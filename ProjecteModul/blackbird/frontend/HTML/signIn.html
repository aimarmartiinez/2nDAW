<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BlackBird — Login / Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./Styles/login-style.css">
</head>
<body>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="registerForm">
                <h1>Create Account</h1>
                <input type="text" id="regFullName" placeholder="Full Name">
                <input type="text" id="regUsername" placeholder="Username">
                <input type="email" id="regEmail" placeholder="Email">
                <input type="password" id="regPassword" placeholder="Password">
                <input type="password" id="regConfirm" placeholder="Confirm your password">
                <button type="button" id="sign-up">Sign Up</button>
            </form>
        </div>
        <div class="form-container sign-in">
            <form id="login">
                <h1>Log In</h1>
                <input type="text" id="username" placeholder="Username"> <i class="fa-solid fa-user"></i>
                <input type="password" id="password" placeholder="Password"><i class="fa-solid fa-lock"></i>
                <div class="bluebtn">
                  <p id="remember">Remember me?</p>
                  <label class="switch">
                    <input type="checkbox">
                    <span class="slider round"></span>
                  </label>
                </div>

                <button type="button" id="log-in">Sign In</button>
            </form>
        </div>
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Your Voice. Your Space. Your Revolution.</p>
                    <span>You already have an account?</span>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>Your voice matters. Your ideas can fly. Your revolution starts here.</p>
                    <span>Don't have an account?</span>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
        <script src="./JS/login-script.js"></script>
</body>
</html>
