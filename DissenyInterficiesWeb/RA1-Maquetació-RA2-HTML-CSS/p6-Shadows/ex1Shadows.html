<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHADOWS 1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Codystar:wght@300;400&family=Monoton&display=swap" rel="stylesheet">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .container {
        display: grid;
        grid-template-columns: repeat(3, 150px);
        grid-template-rows: repeat(3, 150px);
        gap: 100px;
        justify-content: center;
        margin-top: 50px;
        margin-bottom: 50px;
    }
    .item1, .item2, .item3, .item4, .item5, .item6, .item7, .item8, .item9 {
        width: 150px;
        height: 150px;
        border-radius: 15px;
    }
    .item1 {
       box-shadow: 5px 5px  red;
    }
    .item2 {
        box-shadow: 5px 5px 10px red;
    }
    .item3 {
        box-shadow: 0 0 0 5px red;
    }
    .item4 {
        box-shadow: inset 0 0 10px red;
    }
    .item5 {
        box-shadow: inset 10px 10px 50px red;

    }
    .item6 {
        background-color: #ffffff;
        box-shadow:
            -6px 6px 0 red,
            -12px 12px 0 coral,
            -18px 18px 0 pink; 

    }

    .item7 {
        border: 1px solid gray;
        box-shadow: 
            7px -7px 0px 0px white,
            10px -10px 0 red;
    }
    .item8 {
        box-shadow: 0 0 0 5px blue, 0 0 0 8px green, 0 0 0 11px yellow, 0 0 0 14px orange, 0 0 0 17px red;

   }
    .item9 {
        box-shadow: 
            0px 0px 0px 2px blue,
            -6px 6px 0px 0px white,
            -6px 6px 0px 2px green,
            -12px 12px 0px 0px white,
            -12px 12px 0px 2px yellow,
            -18px 18px 0px 0px white,
            -18px 18px 0px 2px orange,
            -24px 24px 0px 0px white,
            -24px 24px 0px 2px red;
        }

        section{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        
        .monoton-regular {
            font-family: "Monoton", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        .bungee-shade-regular {
            font-family: "Bungee Shade", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        
        .codystar-regular {
            font-family: "Codystar", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
            
        #monoton{
            font-family: "Monoton", sans-serif;
            color: #f36651;
            text-shadow:0px -5px #f4c857 ;
        }
        #bungee{
            font-family: "Bungee Shade";
            color: cyan;
            text-shadow: -3px 3px 1px rgb(180, 176, 176);
        }
        #codystar{
            font-family: "Codystar";
            color: blue;
            text-shadow: 0px 0px 5px rgb(0, 153, 255);
        }

</style>
<body>

    <div class="container">

        <div class="item1"></div>
        <div class="item2"></div>
        <div class="item3"></div>
        <div class="item4"></div>
        <div class="item5"></div>
        <div class="item6"></div>
        <div class="item7"></div>
        <div class="item8"></div>
        <div class="item9"></div>
    </div>

    <section>
        <h1>Exercici 2</h1>
        <h2 id="monoton">MONOTON</h2><br>
        <h2 id="bungee">BUNGEE</h2><br>
        <h2 id="codystar">CODYSTAR</h2><br>
    </section>

</body>
</html>
