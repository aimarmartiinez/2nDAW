<html>
    <head>
        <title>Formuari</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>

    <style>
        body{
            background-color: cornflowerblue;
            color:white;
            margin: 0;
            padding: 0;
        }
        header{
            background-color: white;
            height: 50px;
            width: 100%;
            position: relative;
            left: 0;
            right:0;
            top: 0;
        }
        img{
            float: right;
        }
        form{
            width:425px;
            padding:30px;
            text-align: left;
            margin-left: 100px;
            
        }

        button{
            background-color:royalblue;
            color: white;
        }
    </style>

    <body>
        <header>

        </header>
        <img src="background.png">
        
        <form>
            <h1>Cake Order Form</h1>
            <p>Please fill in your information and we'll be sending your order in no time</p><br>

            <label>Name</label>
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name"><br>

            <label>Email</label>
            <input type="email">

            <label>Quantity</label>
            <input type="number"><br>

            <label>Shipping Address</label>
            <input type="text" placeholder="Street Address"><br>
            <input type="text" placeholder="City">
            <input type="text" placeholder="Country"> <br>

            <label>Select your products</label>

            <label><input type="checkbox"><img src="cake1.png" ></label>
            <label><input type="checkbox"><img src="cake2.png" ></label><br>
            <label><input type="checkbox"><img src="cake3.png" ></label>
            <label><input type="checkbox"><img src="cake4.png" ></label>
            <button>PURCHASE</button>
        </form>
    </body>
</html>
