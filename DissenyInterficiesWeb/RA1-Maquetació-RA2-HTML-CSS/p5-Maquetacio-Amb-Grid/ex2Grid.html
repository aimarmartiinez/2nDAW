<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body{
        display: grid;
        grid-template-columns: 200px 200px 200px;
        grid-template-rows: 50px 50px 50px;
        gap: 2px;
    }
    div{
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid black;
        padding: 20px;
        text-align: center;
        background-color: lightgrey;
    }
    div:first-child{

        /*grid-column-start: 1;
        grid-column-end: 4;*/
        grid-column: 1 / 4;
    }
    div:nth-child(2){
        /*grid-column-start: 1;
        grid-column-end: 2;
        grid-row-start: 2;
        grid-row-end: 4;*/
        grid-column: 1 / 2;
        grid-row: 2 / 4;
    }
</style>
<body>
    <div>celda 1</div>
    <div>celda 2</div>
    <div>celda 3</div>
    <div>celda 4</div>
    <div>celda 5</div>
    <div>celda 6</div>
</body>
</html>
