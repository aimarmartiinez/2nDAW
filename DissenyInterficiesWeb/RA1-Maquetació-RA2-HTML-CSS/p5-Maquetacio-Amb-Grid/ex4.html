<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX4</title>
</head>
<style>
    body{
        display: grid;
        grid-template-columns: 200px 100px 300px;
        grid-template-rows: 50px 50px 50px;
        gap: 2px;
    }
    div{
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px solid black;
        padding: 20px;
        text-align: center;
        background-color: cadetblue;
    }
    div:first-child{

        grid-column-start: 1;
        grid-column-end: 3;
        grid-row-start: 1;
        grid-row-end: 1;
    }
    div:nth-child(3){
        grid-column-start: 1;
        grid-column-end: 1;
        grid-row-start: 2;
        grid-row-end: 2;
    }
    div:nth-child(4){
        grid-column-start: 2;
        grid-column-end: 4;
        grid-row-start: 2;
        grid-row-end: 3;
    }
    div:nth-child(5){
        grid-column-start: 1;
        grid-column-end: 4;
        grid-row-start: 3;
        grid-row-end: 3;
    }
</style>
<body>
    <div>celda 1</div>
    <div>celda 2</div>
    <div>celda 3</div>
    <div>celda 4</div>
    <div>celda 5</div>
</body>
</html>
