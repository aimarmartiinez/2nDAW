<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX2 Cartes</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 10px;
    }
    .first-card, .second-card, .third-card, .fourth-card, .fifth-card{
        position:absolute;
        width: 100px;
        height: 145px;
        border: 2px solid black;
        
    }
    img{
        width: 100%;
        height: 100%;
        border-color: black;
    }
    .first-card{
        
        top: 20px;
        left: 70px;
        z-index: 1;
    }
    .second-card{
        top: 60px;
        left: 110px;
        z-index: 2;
    }
    .third-card{
        top: 100px;
        left: 150px;
        z-index: 3;
    }
    .fourth-card{
        top: 140px;
        left: 190px;
        z-index: 4;
    }
    .fifth-card{
        top: 180px;
        left: 230px;
        z-index: 5;
    }

</style>
<body>
    <div class="first-card">
        <img src="10_of_diamonds.png" alt="" >
    </div>
    <div class="second-card">
        <img src="jack_of_diamonds.png" alt="">
    </div>
    <div class="third-card">
        <img src="queen_of_diamonds.png" alt="">
    </div>
    <div class="fourth-card">
        <img src="king_of_diamonds.png" alt="">
    </div>
    <div class="fifth-card">
        <img src="ace_of_diamonds.png" alt="">
    </div>
</body>
</html>
