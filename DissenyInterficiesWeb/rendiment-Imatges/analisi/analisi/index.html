<!DOCTYPE html>
<html lang="ca">

        <article class="card">

        <article class="card">
          <div class="image-wrapper">
            <img src="/landscape.png" alt="Imatge landscape png" />

        <article class="card">
          <div class="image-wrapper">
            <img src="/landscape.jpg" alt="Imatge landscape jpg" />

      </section>

    <script type="module" src="/src/main.ts"></script>
