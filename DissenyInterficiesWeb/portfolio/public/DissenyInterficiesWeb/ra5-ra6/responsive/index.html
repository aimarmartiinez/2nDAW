<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Corrected</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }

        .container {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr;
        }

        .box {
            height: 80px;
            border-radius: 4px;
        }

        .green {
            height: 120px;
        }

        .orange {
            background: #ff9f43;
        }

        .green {
            background: #ddf311;
        }

        .blue {
            background: #488cd7;
        }

        .gray {
            background: #e0e0e0;
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: repeat(12, 1fr);
            }

            .orange {
                grid-column: span 12;
            }

            .green {
                grid-column: span 12;
            }

            .blue {
                grid-column: span 12;
            }

            .gray {
                grid-column: span 6;
            }
        }

        @media (min-width: 1024px) {
            .orange {
                grid-column: span 6;
            }

            .green {
                grid-column: span 12;
            }

            .blue {
                grid-column: span 4;
            }

            .gray {
                grid-column: span 3;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box orange"></div>
        <div class="box orange"></div>

        <div class="box green"></div>

        <div class="box blue"></div>
        <div class="box blue"></div>
        <div class="box blue"></div>

        <div class="box gray"></div>
        <div class="box gray"></div>
        <div class="box gray"></div>
        <div class="box gray"></div>
    </div>

</body>

</html>
